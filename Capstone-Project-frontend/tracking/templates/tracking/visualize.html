<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rodent Tracker Visualizer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid black; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Rodent Tracker Visualizer</h2>

  <label>CSV File: <input type="file" id="csvFileInput" accept=".csv"></label><br>
  <label>Video File (optional): <input type="file" id="videoFileInput" accept="video/*"></label><br><br>

  <label><input type="checkbox" id="toggleConnections" checked> Show Connections</label>
  <label><input type="checkbox" id="toggleTrails" checked> Show Trails</label>
  <label><input type="checkbox" id="toggleSegmentation" checked> Show Segmentation</label>
  <label><input type="checkbox" id="toggleTrajectory" checked> Show Trajectory</label>
  <label><input type="checkbox" id="toggleLegend" checked> Show Legend</label><br><br>

  <button id="startButton">Visualize</button>
  <button id="resetButton">Reset</button><br><br>

  <canvas id="plotCanvas" width="640" height="480"></canvas>
  <video id="videoElement" style="display:none;" muted></video>

  <script>
    const canvas = document.getElementById("plotCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("videoElement");

    let frames = [];
    let partNames = [];
    let trails = {};
    let trajectory = [];
    let partColors = {};

    let minX, maxX, minY, maxY;
    let csvReady = false;
    let videoReady = false;
    let startRequested = false;

    let showConnections = true;
    let showTrails = true;
    let showSegmentation = true;
    let showTrajectory = true;
    let showLegend = true;

    const trailLength = 20;
    const trajectoryOpacity = 0.3;

    // Toggle listeners
    document.getElementById("toggleConnections").addEventListener("change", (e) => showConnections = e.target.checked);
    document.getElementById("toggleTrails").addEventListener("change", (e) => showTrails = e.target.checked);
    document.getElementById("toggleSegmentation").addEventListener("change", (e) => showSegmentation = e.target.checked);
    document.getElementById("toggleTrajectory").addEventListener("change", (e) => showTrajectory = e.target.checked);
    document.getElementById("toggleLegend").addEventListener("change", (e) => showLegend = e.target.checked);

    document.getElementById("startButton").addEventListener("click", () => {
      if (!csvReady) {
        alert("Please upload a CSV file first.");
        return;
      }
      startRequested = true;
      document.getElementById("startButton").disabled = true;
      tryStart();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      startRequested = false;
      document.getElementById("startButton").disabled = false;
      trajectory = [];
      partNames.forEach(p => trails[p] = []);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (videoReady) {
        video.pause();
        video.currentTime = 0;
      }
    });

    document.getElementById("csvFileInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        const lines = e.target.result.trim().split("\n");
        const headerRow = lines[0].split(",");
        partNames = [];

        for (let i = 1; i < headerRow.length; i += 3) {
          if (headerRow[i].endsWith("_x")) {
            const base = headerRow[i].slice(0, -2).trim().toLowerCase().replace(/ /g, "_");
            partNames.push(base);
          }
        }

        trails = {};
        trajectory = [];
        partColors = {};
        const colorPalette = ["red", "green", "blue", "magenta", "orange", "cyan", "purple", "brown", "teal"];
        partNames.forEach((p, i) => {
          trails[p] = [];
          partColors[p] = colorPalette[i % colorPalette.length];
        });

        frames = lines.slice(1).map(line => {
          const parts = line.split(",").slice(1);
          const coords = [];
          for (let i = 0; i < parts.length; i += 3) {
            coords.push(Number(parts[i]));
            coords.push(Number(parts[i + 1]));
          }
          return coords;
        });

        const allX = [], allY = [];
        frames.forEach(frame => {
          for (let i = 0; i < frame.length; i += 2) {
            const x = frame[i];
            const y = frame[i + 1];
            if (!isNaN(x) && !isNaN(y)) {
              allX.push(x);
              allY.push(y);
            }
          }
        });

        minX = Math.min(...allX);
        maxX = Math.max(...allX);
        minY = Math.min(...allY);
        maxY = Math.max(...allY);
        const padX = (maxX - minX) * 0.1;
        const padY = (maxY - minY) * 0.1;
        minX -= padX; maxX += padX;
        minY -= padY; maxY += padY;

        csvReady = true;
      };

      reader.readAsText(file);
    });

    document.getElementById("videoFileInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      const url = URL.createObjectURL(file);
      video.src = url;
      video.load();

      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        videoReady = true;
      };
    });

    function tryStart() {
      if (!csvReady || !startRequested) return;
      if (videoReady) {
        video.play();
        animateWithVideo();
      } else {
        animateStandalone();
      }
    }

    function normalizeCoords(x, y, minX, maxX, minY, maxY, width, height) {
      let normX = ((x - minX) / (maxX - minX)) * (width - 40) + 20;
      let normY = ((y - minY) / (maxY - minY)) * (height - 40) + 20;
      return [Math.max(0, Math.min(normX, width - 1)), Math.max(0, Math.min(normY, height - 1))];
    }

    function drawSegmentation(ctx, positions) {
      if (!showSegmentation) return;
      const bodyParts = ['left_body', 'left_ear', 'right_ear', 'right_body', 'tail_base'];
      if (bodyParts.every(p => positions[p])) {
        ctx.beginPath();
        ctx.moveTo(...positions['left_body']);
        ctx.lineTo(...positions['left_ear']);
        ctx.lineTo(...positions['right_ear']);
        ctx.lineTo(...positions['right_body']);
        ctx.lineTo(...positions['tail_base']);
        ctx.closePath();
        ctx.fillStyle = 'rgba(200, 255, 255, 0.5)';
        ctx.fill();
      }

      const earParts = ['left_ear', 'nose', 'right_ear'];
      if (earParts.every(p => positions[p])) {
        ctx.beginPath();
        ctx.moveTo(...positions['left_ear']);
        ctx.lineTo(...positions['nose']);
        ctx.lineTo(...positions['right_ear']);
        ctx.closePath();
        ctx.fillStyle = 'rgba(200, 200, 255, 0.5)';
        ctx.fill();
      }
    }

    function drawConnections(ctx, positions) {
      if (!showConnections) return;
      ctx.strokeStyle = "rgba(100,100,100,1)";
      ctx.lineWidth = 2;
      const connect = (a, b) => {
        if (positions[a] && positions[b]) {
          ctx.beginPath();
          ctx.moveTo(...positions[a]);
          ctx.lineTo(...positions[b]);
          ctx.stroke();
        }
      };
      connect("nose", "body_center");
      connect("body_center", "tail_base");
      connect("left_ear", "nose");
      connect("nose", "right_ear");
      connect("left_ear", "right_ear");
      connect("left_body", "body_center");
      connect("body_center", "right_body");
      connect("left_body", "left_ear");
      connect("right_body", "right_ear");
      connect("left_body", "tail_base");
      connect("right_body", "tail_base");
    }

    function drawTrails(ctx, trails) {
      if (!showTrails) return;
      ctx.lineWidth = 2;
      for (const part in trails) {
        const points = trails[part];
        if (points.length < 2) continue;
        for (let i = 1; i < points.length; i++) {
          const [x1, y1] = points[i - 1];
          const [x2, y2] = points[i];
          const alpha = 0.2 + 0.8 * (i / points.length);
          ctx.strokeStyle = `rgba(200,0,0,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }

    function drawCentroidTrajectory(ctx, trajectory, opacity) {
      if (!showTrajectory || trajectory.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(...trajectory[0]);
      for (let i = 1; i < trajectory.length; i++) {
        ctx.lineTo(...trajectory[i]);
      }
      ctx.strokeStyle = `rgba(0,255,0,${opacity})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawLegend(ctx, partColors) {
      if (!showLegend) return;
      const margin = 10;
      const dotSize = 6;
      const lineHeight = 25;
      const padding = 10;
      const x = margin;
      const y = margin;
      const width = 160;
      const height = Object.keys(partColors).length * lineHeight + padding * 2;
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, width, height, 8) : ctx.rect(x, y, width, height);
      ctx.fill();
      ctx.stroke();
      ctx.font = "14px sans-serif";
      let yPos = y + padding + 10;
      for (const part in partColors) {
        ctx.fillStyle = partColors[part];
        ctx.beginPath();
        ctx.arc(x + padding, yPos - 5, dotSize, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.fillText(part, x + padding + 15, yPos);
        yPos += lineHeight;
      }
    }

    function drawFrameLogic(coords) {
      const positions = {};
      for (let i = 0; i < coords.length; i += 2) {
        const part = partNames[Math.floor(i / 2)];
        const x = coords[i];
        const y = coords[i + 1];
        if (!isNaN(x) && !isNaN(y)) {
          let nx = x;
          let ny = y;
          if (!videoReady) {
            [nx, ny] = normalizeCoords(x, y, minX, maxX, minY, maxY, canvas.width, canvas.height);
          }
          positions[part] = [nx, ny];
          if (!trails[part]) trails[part] = [];
          trails[part].push([nx, ny]);
          if (trails[part].length > trailLength) trails[part].shift();
        }
      }
      if (positions['body_center'] && positions['left_body'] && positions['right_body']) {
        const [bx, by] = positions['body_center'];
        const [lx, ly] = positions['left_body'];
        const [rx, ry] = positions['right_body'];
        trajectory.push([Math.round((bx + lx + rx) / 3), Math.round((by + ly + ry) / 3)]);
      }
      drawSegmentation(ctx, positions);
      drawConnections(ctx, positions);
      drawTrails(ctx, trails);
      drawCentroidTrajectory(ctx, trajectory, trajectoryOpacity);
      for (const part in positions) {
        const [x, y] = positions[part];
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, 2 * Math.PI);
        ctx.fillStyle = partColors[part] || "red";
        ctx.fill();
      }
      drawLegend(ctx, partColors);
    }

    function animateWithVideo() {
      function drawFrame() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const i = Math.floor((video.currentTime / video.duration) * frames.length);
        if (i < frames.length) drawFrameLogic(frames[i]);
        if (!video.paused && !video.ended) requestAnimationFrame(drawFrame);
      }
      video.addEventListener("play", () => requestAnimationFrame(drawFrame));
    }

    function animateStandalone() {
      let frame = 0;
      function draw() {
        if (frame >= frames.length) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawFrameLogic(frames[frame]);
        frame++;
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
