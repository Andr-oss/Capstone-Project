<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Visualize - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Select CSV file to visualize</h1>
        <div>
            <form id="uploadForm" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="videoUpload">Upload Videos:</label>
                    <input type="file" id="videoUpload" name="videos" multiple accept="video/*">
                </div>

                <div class="form-group">
                    <label for="csvUpload">Upload CSV Files:</label>
                    <input type="file" id="csvUpload" name="csv_files" multiple accept=".csv">
                </div>

                <div class="form-group">
                    <label><input type="checkbox" id="showTrails" name="show_trails"> Show Trails</label>
                </div>
                <div class="form-group">
                    <label for="trailLength">Trail Length (0-50):</label>
                    <input type="range" id="trailLength" name="trail_length" min="0" max="50" value="25">
                    <span id="trailLengthValue">25</span>
                </div>
                <br>


                <div class="form-group">
                    <label><input type="checkbox" id="showTrajectory" name="show_trajectory" checked> Show Trajectory</label>
                </div>
                <div class="form-group">
                    <label for="trajectoryOpacity">Trajectory Opacity:</label>
                    <input type="range" id="trajectoryOpacity" name="trajectory_opacity" min="0" max="1" step="0.1" value="0.3">
                    <span id="trajectoryOpacityValue">0.3</span>
                </div>
                <br>

                <div class="form-group">
                    <label><input type="checkbox" id="showConnections" name="show_connections" checked> Show Connections</label>
                </div>

                <div class="form-group">
                    <label><input type="checkbox" id="showSegmentation" name="show_segmentation" checked> Show Segmentation</label>
                </div>

                <div class="form-group">
                    <label for="segmentationOpacity">Segmentation Opacity:</label>
                    <input type="range" id="segmentationOpacity" name="segmentation_opacity" min="0" max="1" step="0.1" value="0.5">
                    <span id="segmentationOpacityValue">0.5</span>
                </div>
                <br>

                <div class="form-group">
                    <label><input type="checkbox" id="showLabels" name="showLabels" checked> Show Labels</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="showLegend" name="showLegend" checked> Show Legend</label>
                </div>
                <br>

                <button type="button" onclick="">Visualize</button>
            </form>
        </div>
    </div>

    <script>
        // Update the trail length value when slider is moved
        document.getElementById('trailLength').addEventListener('input', function() {
            document.getElementById('trailLengthValue').textContent = this.value;
        });

        // Update the trajectory opacity value when slider is moved
        document.getElementById('trajectoryOpacity').addEventListener('input', function() {
            document.getElementById('trajectoryOpacityValue').textContent = this.value;
        });

        // Update the segmentation opacity value when slider is moved
        document.getElementById('segmentationOpacity').addEventListener('input', function() {
            document.getElementById('segmentationOpacityValue').textContent = this.value;
        });
    </script>
</body>
</html>
