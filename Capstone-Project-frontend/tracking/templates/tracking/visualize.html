<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Visualize - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
    <style>
        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        .status-message.success {
            background-color: #4CAF50;
            color: white;
        }
        .status-message.error {
            background-color: #f44336;
            color: white;
        }
        .status-message.info {
            background-color: #2196F3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select CSV file to visualize</h1>
        <div id="statusMessage" class="status-message"></div>
        <div>
            <form id="uploadForm" method="post" enctype="multipart/form-data" action="{% url 'run_visualize' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="csvUpload">Upload CSV File:</label>
                    <input type="file" id="csvUpload" name="csv_files" accept=".csv" required>
                </div>

                <div class="form-group">
                    <label for="videoUpload">Upload Video (optional):</label>
                    <input type="file" id="videoUpload" name="videos" accept="video/*">
                </div>

                <div class="form-group">
                    <label><input type="checkbox" id="showTrails" name="show_trails"> Show Trails</label>
                </div>
                <div class="form-group">
                    <label for="trailLength">Trail Length:</label>
                    <input type="range" id="trailLength" name="trail_length" min="0" max="50" value="10">
                    <span id="trailLengthValue">10</span>
                </div>
                <br>

                <div class="form-group">
                    <label><input type="checkbox" id="showTrajectory" name="show_trajectory" checked> Show Trajectory</label>
                </div>
                <div class="form-group">
                    <label for="trajectoryOpacity">Trajectory Opacity:</label>
                    <input type="range" id="trajectoryOpacity" name="trajectory_opacity" min="0" max="1" step="0.1" value="0.3">
                    <span id="trajectoryOpacityValue">0.3</span>
                </div>
                <br>

                <div class="form-group">
                    <label><input type="checkbox" id="showConnections" name="show_connections" checked> Show Connections</label>
                </div>

                <div class="form-group">
                    <label><input type="checkbox" id="showSegmentation" name="show_segmentation" checked> Show Segmentation</label>
                </div>

                <div class="form-group">
                    <label for="segmentationOpacity">Segmentation Opacity:</label>
                    <input type="range" id="segmentationOpacity" name="segmentation_opacity" min="0" max="1" step="0.1" value="0.5">
                    <span id="segmentationOpacityValue">0.5</span>
                </div>
                <br>

                <div class="form-group">
                    <label><input type="checkbox" id="showLabels" name="showLabels" checked> Show Labels</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="showLegend" name="showLegend" checked> Show Legend</label>
                </div>
                <br>

                <button type="submit">Visualize</button>
            </form>
        </div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            statusDiv.style.display = 'block';

            // Hide after 3 seconds
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // Update the trail length value when slider is moved
        document.getElementById('trailLength').addEventListener('input', function() {
            document.getElementById('trailLengthValue').textContent = this.value;
        });

        // Update the trajectory opacity value when slider is moved
        document.getElementById('trajectoryOpacity').addEventListener('input', function() {
            document.getElementById('trajectoryOpacityValue').textContent = this.value;
        });

        // Update the segmentation opacity value when slider is moved
        document.getElementById('segmentationOpacity').addEventListener('input', function() {
            document.getElementById('segmentationOpacityValue').textContent = this.value;
        });

        // Form submission handler
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const csvFile = document.getElementById('csvUpload').files[0];
            if (!csvFile) {
                showStatus('Please select a CSV file', 'error');
                return;
            }

            showStatus('Starting visualization...', 'success');

            const formData = new FormData(this);

            // Replace your fetch code with this:
            fetch(this.action, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                // Check if the response is JSON or a file
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    // It's JSON (probably an error)
                    return response.json().then(data => {
                        showStatus('Error: ' + data.message, 'error');
                    });
                } else {
                    // It's a file - trigger download
                    return response.blob().then(blob => {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        // Get filename from content-disposition header if available
                        const disposition = response.headers.get('content-disposition');
                        let filename = 'visualization.mp4';
                        if (disposition && disposition.indexOf('filename') !== -1) {
                            filename = disposition.split('filename=')[1].replace(/["']/g, '');
                        }
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        showStatus('Visualization downloaded successfully', 'success');
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showStatus('An error occurred during visualization', 'error');
            });
        });
    </script>
</body>
</html>
