<!-- tracking/templates/tracking/new_videos.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>New Videos - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
    <style>
        #progressContainer {
            width: 50%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 20px;
            display: none; /* Hidden until processing starts */
        }
        #progressBar {
            width: 0%;
            height: 20px;
            background-color: #4caf50;
            text-align: center;
            color: #fff;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Videos</h1>
        <div>
            <!-- Form for video upload -->
            <form id="uploadForm" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" id="videoUpload" name="videos" multiple accept="video/*">
                <br>
                <label for="modelOption">Select Processing Model:</label>
                <select name="model_option" id="modelOption">
                    <option value="deeplabcut">Deeplabcut (Active)</option>
                    <option value="roboflow">Roboflow (Not Active)</option>
                </select>
            </form>
            <!-- Control buttons -->
            <button type="button" onclick="processVideos()">Process</button>
            <button type="button" onclick="stopProcess()">Stop process</button>
            <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="uploadAndVisualizeCSV()">
            <button type="button" onclick="document.getElementById('csvUpload').click()">Visualize CSV</button>
            <input type="file" id="csvUpload" style="display: none;" accept=".csv" onchange="uploadAndVisualizeCSV()">
            <div id="visualizationResult" style="margin-top: 20px;"></div>
        </div>

        <!-- Video player element; hidden by default -->
        <video id="videoPlayer" controls style="display: none; width: 100%; max-width: 600px; margin-top: 20px;">
            Your browser does not support the video tag.
        </video>

        <!-- Progress bar elements -->
        <div id="progressContainer">
            <div id="progressBar">0%</div>
        </div>

        <!-- Download button (VISIBLE only after 100% progress) -->
        <a id="downloadBtn"
           href="#"
           style="display: none; margin-top: 15px; padding: 10px 20px; background-color: #4caf50; color: white; border: none; border-radius: 5px; text-decoration: none;">
           ⬇ Download CSV
        </a>
        </div> <!-- Keep this as the end of .container -->


    <script>
        let progressInterval = null;

        function processVideos() {
            const fileInput = document.getElementById("videoUpload");
            if (fileInput.files.length === 0) {
                alert("Please select a video file to process.");
                return;
            }
            const videoFile = fileInput.files[0];
            if (!videoFile.type.startsWith("video/")) {
                alert("Selected file is not a video.");
                return;
            }

            // Preview the video locally.
            const videoPlayer = document.getElementById("videoPlayer");
            videoPlayer.src = URL.createObjectURL(videoFile);
            videoPlayer.style.display = "block";
            videoPlayer.play();

            // Show progress bar & reset to 0
            document.getElementById("progressContainer").style.display = "block";
            updateProgressBar(0);

            // Send form data to backend
            const formData = new FormData(document.getElementById("uploadForm"));
            fetch("{% url 'process_video' %}", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    alert(data.status); // "Processing started"
                    startPolling();
                }
            })
            .catch(err => {
                console.error("Error:", err);
                updateProgressBar(0, true);
            });
        }

        function stopProcess() {
            const videoPlayer = document.getElementById("videoPlayer");
            if (!videoPlayer.paused) {
                videoPlayer.pause();
            }
            fetch("{% url 'stop_video' %}", { method: "POST" })
            .then(res => res.json())
            .then(data => {
                alert(data.status);
                stopPolling();
                updateProgressBar(0, true);
            })
            .catch(err => {
                console.error("Error stopping process:", err);
                alert("An error occurred while stopping the process.");
            });
        }

        function startPolling() {
    progressInterval = setInterval(() => {
        fetch("{% url 'get_progress' %}")
        .then(res => res.json())
        .then(data => {
            if (typeof data.progress !== "undefined") {
                updateProgressBar(data.progress);

                // Show download button only if processing is 100% done
                if (data.progress >= 100) {
                    stopPolling();
                    if (data.csv_url) {
                        const downloadBtn = document.getElementById("downloadBtn");
                        downloadBtn.href = data.csv_url;
                        downloadBtn.style.display = "inline-block"; // 👈 Show it now
                    }
                }
            }
        })
        .catch(err => console.error("Error polling progress:", err));
    }, 1000); // Poll every 1s
}


        function stopPolling() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function updateProgressBar(value, hide=false) {
            const bar = document.getElementById("progressBar");
            bar.style.width = value + "%";
            bar.textContent = value + "%";
            if (hide) {
                document.getElementById("progressContainer").style.display = "none";
            }
        }

        // Download the CSV from the server route (data.csv_url)
     function downloadCSV(downloadUrl) {
         fetch(downloadUrl)
        .then(res => {
            if (!res.ok) {
                throw new Error("Network response was not ok");
            }
            return res.blob();
        })
        .then(blob => {
            const fileURL = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = fileURL;

            // 👇 Prompt for filename
            const filename = prompt("Enter a name for the CSV file:", "output_postprocessed.csv");
            a.download = filename || "output_postprocessed.csv";

            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(fileURL);
        })
        .catch(err => {
            console.error("Error fetching CSV file:", err);
            alert("An error occurred while fetching the CSV file.");
        });
     }

    </script>
</body>
</html>
