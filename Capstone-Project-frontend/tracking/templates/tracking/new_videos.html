<!-- tracking/templates/tracking/new_videos.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>New Videos - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>New Videos</h1>
        <div>
            <!-- Form for video upload -->
            <form id="uploadForm" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <!-- File input to select multiple videos (visible for demo purposes) -->
                <input type="file" id="videoUpload" name="videos" multiple accept="video/*">
                <!-- Option select for processing model -->
                <br>
                <label for="modelOption">Select Processing Model:</label>
                <select name="model_option" id="modelOption">
                    <option value="deeplabcut">Deeplabcut</option>
                    <option value="roboflow">Roboflow</option>
                </select>
            </form>
            <!-- Control buttons -->
            <button type="button" onclick="processVideos()">Process</button>
            <button type="button" onclick="stopProcess()">Stop process</button>
        </div>
        <!-- Video player element; hidden by default -->
        <video id="videoPlayer" controls style="display: none; width: 100%; max-width: 600px; margin-top: 20px;">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        // Function to preview the uploaded video and process it.
        function processVideos() {
            var fileInput = document.getElementById("videoUpload");
            if (fileInput.files.length === 0) {
                alert("Please select a video file to process.");
                return;
            }
            // Take the first selected video file.
            var videoFile = fileInput.files[0];
            if (!videoFile.type.startsWith("video/")) {
                alert("Selected file is not a video.");
                return;
            }

            // Preview the video locally.
            var videoPlayer = document.getElementById("videoPlayer");
            var fileURL = URL.createObjectURL(videoFile);
            videoPlayer.src = fileURL;
            videoPlayer.style.display = "block";
            videoPlayer.play();

            // Create FormData from the upload form.
            var formData = new FormData(document.getElementById("uploadForm"));

            // Send AJAX POST request to process the video.
            fetch("{% url 'process_video' %}", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                } else if (data.status === "Processing completed successfully" && data.csv_file) {
                    // Automatically fetch the CSV file as a blob and trigger the Save As dialog.
                    fetch(data.csv_file)
                        .then(res => res.blob())
                        .then(blob => {
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            a.download = 'output_postprocessed.csv';
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);
                        })
                        .catch(err => {
                            console.error("Error fetching CSV file:", err);
                            alert("An error occurred while fetching the CSV file.");
                        });
                }
            })
            .catch(error => {
                console.error("Error during processing:", error);
                alert("An error occurred during processing.");
            });
        }

        // Function to pause/stop the video playback and send a stop request.
        function stopProcess() {
            var videoPlayer = document.getElementById("videoPlayer");
            if (!videoPlayer.paused) {
                videoPlayer.pause();
            }
            // Send stop request to backend.
            fetch("{% url 'stop_video' %}", {
                method: "POST",
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    alert("Process stopped: " + data.status);
                }
            })
            .catch(error => {
                console.error("Error during stop process:", error);
                alert("An error occurred while stopping the process.");
            });
        }
    </script>
</body>
</html>
