<!-- tracking/templates/tracking/Process.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Process Video - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Process Videos</h1>
        <div>
            <!-- Form for video upload -->
            <form id="uploadForm" method="post" enctype="multipart/form-data"
                  action="{% url 'process_video' %}">
                {% csrf_token %}
                <!-- File input to select multiple videos (visible for demo purposes) -->
                <input type="file" id="videoUpload" name="videos" multiple accept="video/*">
                <!-- New: Option select for processing model -->
                <br>
                <label for="modelOption">Select Processing Model:</label>
                <select name="model_option" id="modelOption">
                    <option value="deeplabcut">Deeplabcut (Active)</option>
                    <option value="roboflow">Roboflow (Inactive)</option>
                </select>
                <p id="statusMessage"></p>
            </form>
            <!-- Action buttons -->
            <button type="button" onclick="processVideos()" id="processBtn">Process</button>

            <!-- Output file location display -->
            <div id="outputInf o" style="margin-top: 10px; display: none;">
                <p>Output saved to: <span id="outputLocation"></span></p>
            </div>
        </div>
    </div>
    <script>
        // Store the current task ID
        let currentTaskId = null;

        function processVideos() {
            var fileInput = document.getElementById("videoUpload");
            if (fileInput.files.length === 0) {
                alert("Please select a video file to process.");
                return;
            }

            // Create a FormData object
            var formData = new FormData(document.getElementById("uploadForm"));

            // Send the request to start processing
            fetch("{% url 'process_video' %}", {
                method: "POST",
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'started') {
                    // Store the task ID
                    currentTaskId = data.task_id;
                    document.getElementById("statusMessage").textContent = "Processing started...";

                    // Start polling for status
                    pollTaskStatus();
                } else {
                    throw new Error(data.message || 'Failed to start processing');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("statusMessage").textContent = "Error: " + error.message;
            });
        }

        function pollTaskStatus() {
            if (!currentTaskId) return;

            fetch(`{% url 'check_task_status' %}?task_id=${currentTaskId}`)
            .then(response => response.json())
            .then(data => {
                // Update status display
                document.getElementById("statusMessage").textContent = data.message;

                if (data.status === 'processing' || data.status === 'post-processing') {
                    // Continue polling
                    setTimeout(pollTaskStatus, 2000);
                }
                else if (data.status === 'complete') {
                    // Download the file
                    window.location.href = `{% url 'download_result' %}?task_id=${currentTaskId}`;

                    // Re-enable the process button
                    document.getElementById("processBtn").disabled = false;
                }
                else if (data.status === 'error' || data.status === 'stopped') {
                    // Show error
                    document.getElementById("statusMessage").textContent = "Error: " + data.message;
                    document.getElementById("progressIndicator").style.width = "0%";
                    document.getElementById("progressIndicator").style.backgroundColor = "#f44336";

                    // Re-enable the process button
                    document.getElementById("processBtn").disabled = false;
                }
            })
            .catch(error => {
                console.error('Error checking status:', error);

                // If there's an error in polling, try again after a longer delay
                setTimeout(pollTaskStatus, 5000);
            });
        }
    </script>
</body>
</html>
