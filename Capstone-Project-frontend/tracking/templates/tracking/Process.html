<!-- tracking/templates/tracking/Process.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Process Video - Rodent Video Tracking</title>
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>New Videos</h1>
        <div>
            <!-- Form for video upload -->
            <form id="uploadForm" method="post" enctype="multipart/form-data"
                  action="{% url 'process_video' %}" target="_blank">
                {% csrf_token %}
                <!-- File input to select multiple videos (visible for demo purposes) -->
                <input type="file" id="videoUpload" name="videos" multiple accept="video/*">
                <!-- New: Option select for processing model -->
                <br>
                <label for="modelOption">Select Processing Model:</label>
                <select name="model_option" id="modelOption">
                    <option value="deeplabcut">Deeplabcut (Active)</option>
                    <option value="roboflow">Roboflow (Inactive)</option>
                </select>
                <!-- New: Output directory selection -->
                <br>
                <label for="outputDirectory">Output Directory:</label>
                <input type="text" id="outputDirectory" name="output_directory" placeholder="Enter path or use default">
                <button type="button" onclick="selectDirectory()" id="selectDirBtn">Browse...</button>
            </form>
            <!-- Action buttons -->
            <button type="button" onclick="processVideos()" id="processBtn">Process</button>
            <button type="button" onclick="stopProcess()" id="stopBtn">Stop process</button>

            <!-- Output file location display -->
            <div id="outputInfo" style="margin-top: 10px; display: none;">
                <p>Output saved to: <span id="outputLocation"></span></p>
            </div>
        </div>
    </div>

    <script>
        function selectDirectory() {
            // Here we're just setting a sample path
            const defaultPath = "C:\\Users\\Username\\Documents\\RodentTracking";
            document.getElementById("outputDirectory").value = defaultPath;
        }

    function processVideos() {
        var fileInput = document.getElementById("videoUpload");
        if (fileInput.files.length === 0) {
            alert("Please select a video file to process.");
            return;
        }

        // Optional: Basic file-type check
        var videoFile = fileInput.files[0];
        if (!videoFile.type.startsWith("video/")) {
            alert("Selected file is not a video.");
            return;
        }

        // Show a simple "Processing..." message
        document.getElementById("processingStatus").style.display = "block";
        document.getElementById("statusMessage").textContent = "Processing video... please wait";

        // Disable the process button so it can’t be clicked repeatedly
        document.getElementById("processBtn").disabled = true;

        // Submit the form to trigger the file download
        const form = document.getElementById("uploadForm");
        form.action = "{% url 'process_video' %}";
        form.method = "POST";
        form.submit();
    }

        // Function to check processing status periodically
        function checkProcessingStatus() {
            // Update progress bar
            var progress = parseInt(document.getElementById("progressIndicator").style.width) || 10;
            if (progress < 90) {
                progress += 5;
                document.getElementById("progressIndicator").style.width = progress + "%";
            }

            // Check status from the server
            fetch("{% url 'check_processing_status' %}")
            .then(response => response.json())
            .then(data => {
                if (data.status === "complete") {
                    processingComplete(data.csv_file);
                } else if (data.status === "error") {
                    document.getElementById("statusMessage").textContent = "Error: " + data.message;
                    document.getElementById("progressIndicator").style.width = "0%";
                    document.getElementById("progressIndicator").style.backgroundColor = "#f44336";
                } else {
                    // Still processing, check again in 2 seconds
                    setTimeout(checkProcessingStatus, 2000);
                }
            })
            .catch(error => {
                console.error("Error checking status:", error);
                // Try again in 3 seconds
                setTimeout(checkProcessingStatus, 3000);
            });
        }

        // Function to handle when processing is complete
        function processingComplete(csvFile) {
            // Update status
            document.getElementById("statusMessage").textContent = "Processing complete!";
            document.getElementById("progressIndicator").style.width = "100%";

            // Display output location
            document.getElementById("outputInfo").style.display = "block";
            document.getElementById("outputLocation").textContent = csvFile;
        }

        // Function to stop the processing
        function stopProcess() {
            // Update status
            document.getElementById("statusMessage").textContent = "Stopping process...";

            // Send a request to stop backend processing
            fetch("{% url 'stop_video' %}", {
                method: "POST",
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("statusMessage").textContent = "Error: " + data.error;
                } else {
                    document.getElementById("statusMessage").textContent = "Process stopped: " + data.status;
                    document.getElementById("progressIndicator").style.width = "0%";
                    // Hide output info when process is stopped
                    document.getElementById("outputInfo").style.display = "none";
                }
            })
            .catch(error => {
                console.error("Error during stop process:", error);
                document.getElementById("statusMessage").textContent = "An error occurred while stopping the process.";
            });
        }
    </script>
</body>
</html>
